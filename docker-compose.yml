# ---------------- PART I ----------------
# Runs the image pulled from Docker Hub + MySQL with a persistent volume.
# Start:  docker compose -p part1 up -d
services:
  db:
    image: mysql:8.0
    container_name: p1-db
    restart: unless-stopped
    command: --performance-schema=OFF        # saves RAM on small EC2
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: studentdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    ports:
      - "3307:3306"                          # host 3307 -> container 3306
    volumes:
      - p1_db_data:/var/lib/mysql            # data stays after restart
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ahmadkhan0901/student-records:v1  # image pushed to Docker Hub
    container_name: p1-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: appuser
      DB_PASSWORD: apppass123
      DB_NAME: studentdb
      APP_LABEL: "Student Records - Part I (Docker Hub image)"
    ports:
      - "8000:5000"                          # host 8000 -> container 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  p1_db_data:

# ---------------- PART II ----------------
# Used by Jenkins. No Dockerfile: the code is attached as a volume.
# Different host ports and container names from Part I.
services:
  db:
    image: mysql:8.0
    container_name: p2-db
    restart: unless-stopped
    command: --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: studentdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    ports:
      - "3308:3306"
    volumes:
      - p2_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: python:3.11-slim                  # plain base image, no custom build
    container_name: p2-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../app:/app                          # code from the Jenkins workspace
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: appuser
      DB_PASSWORD: apppass123
      DB_NAME: studentdb
      APP_LABEL: "Student Records - Part II (built by Jenkins)"
    ports:
      - "9090:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  p2_db_data:
